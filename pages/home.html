<!doctype html>
<html lang="en" prefix="og: https://ogp.me/ns#">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Title, description, canonical, Open Graph, Twitter card and JSON-LD.
         Home uses the site-wide defaults; see pages/common/seo.html to override. -->
  {% include "common/seo.html" %}

  <!-- Fonts (replaces next/font) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  {% include "common/favicon.html" %}

  <!-- Tailwind, compiled ahead of time by tools/build_assets.mjs from
       assets/css/tailwind.css, which is where the @theme tokens live now.
       Linked before global.css so global.css still wins the ties it did. -->
  <link rel="stylesheet" href="/assets/build/tailwind.css" />

  <link rel="stylesheet" href="/assets/css/global.css" />
</head>

<body class="custom-cursor">
  <!-- The splash is also the only markup a crawler gets before the JSX runs,
       so it carries the name and the role rather than a bare word. React
       replaces it on mount with the real page, which says the same thing in
       the hero, so nothing here claims anything the page does not show.

       It used to carry the portrait too, back when Google rendered this page
       blank and an <img> in the served HTML was the only one it could reach.
       That is no longer true: the entrance animations now resolve without a
       scroll, so the renderer sees the real portrait in the About section,
       and the sitemap names that same file through the image extension. The
       photo was the first thing a visitor saw, at a size and in a context the
       design never intended, which is too high a price for a duplicate of
       something Google already has two routes to. -->
  <div id="root">
    <div class="boot">
      <h1 class="boot-name">Sabbir Hassan</h1>
      <p class="boot-role">Fullstack Developer &amp; Designer</p>
    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>

  <!-- Paints a thumbnail's blurhash while the file downloads (project cards). -->
  <script src="/assets/js/blurhash.js"></script>

  <!-- One compiled bundle, not twenty .jsx files and a compiler. The
       sources are still assets/jsx/*.jsx; what goes in here, and in what
       order, is tools/bundles.json. After editing any .jsx:
       node tools/build_assets.mjs -->
  <script src="/assets/build/home.js"></script>
</body>

</html>
